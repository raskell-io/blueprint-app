# Test the Rust core, build the module within its size budget, build the static app.
# Cloudflare Pages builds and deploys on its own (GitHub integration, build command `npm run build`, output `build`).
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: rustup show active-toolchain   # installs the toolchain and wasm target from rust-toolchain.toml
      - run: npm ci
      - run: mise run build
