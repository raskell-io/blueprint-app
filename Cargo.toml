# The Rust half: a pure core (testable natively, no wasm or JS anywhere in it) and a thin wasm crate that exports a
# C ABI over it. No wasm-bindgen: the boundary is a few numbers and a pointer into linear memory.
[workspace]
members = ["crates/core", "crates/wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

# Size and speed for the browser: one codegen unit, fat LTO, no unwinding tables.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
